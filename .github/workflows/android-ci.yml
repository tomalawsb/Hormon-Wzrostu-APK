name: PaczkaHub temporary APK build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-paczkahub:
    name: Zbuduj PaczkaHub APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Zainstaluj Android API 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Odtworz projekt PaczkaHub
        shell: bash
        run: |
          cat ci-paczkahub/part-*.txt | base64 --decode > /tmp/paczkahub.zip
          echo "0603befea83865501db520cbb7db77bb4614497bbe3bfc7b49cd246c1066b829  /tmp/paczkahub.zip" | sha256sum -c -
          rm -rf paczkahub
          mkdir paczkahub
          unzip -q /tmp/paczkahub.zip -d paczkahub

      - name: Zbuduj APK debug
        working-directory: paczkahub
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Zweryfikuj APK
        shell: bash
        run: |
          APK="paczkahub/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/PaczkaHub-1.0.0-debug.apk
          sha256sum dist/PaczkaHub-1.0.0-debug.apk

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: PaczkaHub-1.0.0-debug
          path: dist/PaczkaHub-1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 7
