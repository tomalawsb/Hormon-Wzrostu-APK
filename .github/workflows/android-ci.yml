name: PaczkaHub 1.0.2 responsive test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: paczkahub-responsive-${{ github.sha }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  test:
    name: Build and test PaczkaHub 1.0.2 on small Android 16 screen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
      - name: Android build SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore PaczkaHub 1.0.2 source
        shell: bash
        run: |
          cat ci-paczkahub/part-*.txt | base64 --decode > /tmp/paczkahub.zip
          echo "0603befea83865501db520cbb7db77bb4614497bbe3bfc7b49cd246c1066b829  /tmp/paczkahub.zip" | sha256sum -c -
          rm -rf paczkahub && mkdir paczkahub
          unzip -q /tmp/paczkahub.zip -d paczkahub
          cat ci-paczkahub-v101/main-*.b64 | base64 --decode > paczkahub/app/src/main/java/pl/paczkahub/MainActivity.java
          cp ci-paczkahub/build.gradle.1.0.1 paczkahub/app/build.gradle
          cat ci-paczkahub-v102/patch-part-*.b64 | base64 --decode > /tmp/paczkahub-1.0.2.patch
          cd paczkahub
          patch --batch -p4 < /tmp/paczkahub-1.0.2.patch
          grep -q "versionName '1.0.2'" app/build.gradle
      - name: Build APK
        working-directory: paczkahub
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose paczkahub/app/build/outputs/apk/debug/app-debug.apk
      - name: Android 16 small-screen UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            adb install -r paczkahub/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.15
            adb shell am force-stop pl.paczkahub
            adb shell am start -W -n pl.paczkahub/.MainActivity
            sleep 3
            test -n "$(adb shell pidof pl.paczkahub | tr -d '\r')"
            adb shell input tap 660 130
            sleep 2
            adb shell uiautomator dump /sdcard/paczkahub-settings-top.xml
            adb pull /sdcard/paczkahub-settings-top.xml /tmp/paczkahub-settings-top.xml
            grep -q 'text="Ustawienia"' /tmp/paczkahub-settings-top.xml
            adb shell input swipe 360 1080 360 260 500
            adb shell input swipe 360 1080 360 260 500
            adb shell input swipe 360 1080 360 260 500
            adb shell uiautomator dump /sdcard/paczkahub-settings.xml
            adb pull /sdcard/paczkahub-settings.xml /tmp/paczkahub-settings.xml
            grep -q 'text="Zapisz ustawienia"' /tmp/paczkahub-settings.xml
            adb exec-out screencap -p > /tmp/paczkahub-settings-small.png
            adb logcat -d > /tmp/paczkahub-logcat.txt
      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PaczkaHub-1.0.2-responsive-test
          path: |
            /tmp/paczkahub-settings-top.xml
            /tmp/paczkahub-settings.xml
            /tmp/paczkahub-settings-small.png
            /tmp/paczkahub-logcat.txt
          if-no-files-found: ignore
          retention-days: 2
