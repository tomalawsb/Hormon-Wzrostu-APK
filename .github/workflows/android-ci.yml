name: Testy i wydanie Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DH_BUILD_WORKSPACE: '1'
      ANDROID_CHECK_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Kopia robocza poza źródłami
        run: |
          mkdir -p "$RUNNER_TEMP/dzienniczek/work"
          rsync -a --exclude=.git --exclude=node_modules --exclude=build --exclude=.gradle --exclude='*.apk' --exclude='*.aab' --exclude='*.zip' "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/dzienniczek/work/"
          echo "DH_WORK=$RUNNER_TEMP/dzienniczek/work" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gradle-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Testy web i Android
        run: |
          cd "$DH_WORK"
          npm ci --no-audit --no-fund
          chmod +x android/gradlew
          npm test
      - name: Podpisane wydanie
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretów podpisu. Nie utworzono release."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/dzienniczek/upload-key.p12"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          export ANDROID_KEYSTORE_FILE="$KEYSTORE_FILE"
          cd "$DH_WORK/android"
          ./gradlew --no-daemon assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dzienniczek-Hormonu-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/dzienniczek/work/android/app/build/outputs/apk/**/*.apk
            ${{ runner.temp }}/dzienniczek/work/android/app/build/outputs/bundle/**/*.aab
            ${{ runner.temp }}/dzienniczek/work/android/app/build/reports/lint-results-debug.html
            ${{ runner.temp }}/dzienniczek/work/www/
          retention-days: 14
