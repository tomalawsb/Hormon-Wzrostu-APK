name: Build BurzaRadar APK

on:
  push:
    branches:
      - build-burzaradar-1.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stormwatch

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android API 35
        shell: bash
        run: |
          echo "sdkmanager: $(command -v sdkmanager)"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Zbuduj debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Nazwij APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BurzaRadar-1.0.apk
          sha256sum dist/BurzaRadar-1.0.apk > dist/SHA256SUMS.txt

      - name: Artefakt APK
        uses: actions/upload-artifact@v4
        with:
          name: BurzaRadar-1.0
          path: |
            stormwatch/dist/BurzaRadar-1.0.apk
            stormwatch/dist/SHA256SUMS.txt
          retention-days: 30
