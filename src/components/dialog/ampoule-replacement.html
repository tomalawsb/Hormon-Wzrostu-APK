<dialog id="ampoule-replacement-dialog" class="entry-dialog replacement-dialog" aria-labelledby="replacement-title" aria-describedby="replacement-description">
  <div class="dialog-header">
    <div><p class="eyebrow" id="replacement-profile">Profil</p><h2 id="replacement-title">Potwierdź wymianę ampułki</h2></div>
    <svg class="app-icon replacement-icon" aria-hidden="true"><use href="#icon-ampoule"></use></svg>
  </div>
  <p id="replacement-description"></p>
  <label class="replacement-choice-label"><span>Ampułka we wstrzykiwaczu</span><select id="replacement-choice"></select></label>
  <p id="replacement-stock-note" class="muted"></p>
  <p class="replacement-separate-note">Potwierdzenie wymiany nie zapisuje podania.</p>
  <div class="dialog-actions">
    <button id="replacement-defer" class="button button--secondary" type="button">Jeszcze nie</button>
    <button id="replacement-confirm" class="button button--primary" type="button">Tak, wymieniono</button>
  </div>
</dialog>
