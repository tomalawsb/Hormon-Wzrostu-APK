<!doctype html>
<html lang="pl">
  <meta charset="utf-8" /><title>Dzienniczek Hormonu — grafika Google Play</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #eff7f5;
      color: #143b3d;
    }
    .orb {
      position: absolute;
      width: 620px;
      height: 620px;
      border-radius: 50%;
      background: #daeeea;
      right: -180px;
      top: -120px;
    }
    .brand {
      position: absolute;
      left: 64px;
      top: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 23px;
      font-weight: 700;
    }
    .brand img {
      width: 60px;
      height: 60px;
      border-radius: 14px;
    }
    h1 {
      position: absolute;
      left: 64px;
      top: 137px;
      font-size: 49px;
      line-height: 1.12;
      letter-spacing: -1.4px;
      font-weight: 750;
      margin: 0;
    }
    .sub {
      position: absolute;
      left: 67px;
      top: 270px;
      font-size: 21px;
      line-height: 1.55;
      color: #41666a;
      max-width: 440px;
    }
    .tags {
      position: absolute;
      left: 64px;
      bottom: 49px;
      display: flex;
      gap: 10px;
    }
    .tags span {
      padding: 11px 17px;
      border: 1px solid #bbd8d3;
      border-radius: 24px;
      font-size: 15px;
      color: #245a58;
      background: #f8fcfb;
    }
    .card {
      position: absolute;
      left: 602px;
      top: 84px;
      width: 333px;
      height: 330px;
      padding: 30px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 18px 38px #275d5915;
      border: 1px solid #d4e5e1;
    }
    .eyebrow {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #168074;
    }
    .card h2 {
      font-size: 29px;
      line-height: 1.22;
      margin: 14px 0 24px;
      letter-spacing: -0.5px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 20px 0;
      font-size: 18px;
      color: #34565a;
    }
    .check {
      width: 30px;
      height: 30px;
      background: #e0f3ed;
      color: #087366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
    }
    .line {
      height: 1px;
      background: #e4eeeb;
      margin-top: 23px;
    }
    .small {
      font-size: 14px;
      color: #627d80;
      margin-top: 20px;
    }
  </style>
  <div class="orb"></div>
  <div class="brand"><img src="../../icon-512.png" alt="" />Dzienniczek Hormonu</div>
  <h1>Codzienny zapis.<br />Więcej porządku.</h1>
  <p class="sub">Podania, ampułki i zapas<br />w Twoim dzienniczku.</p>
  <div class="tags">
    <span>Bez reklam</span><span>Bez konta</span><span>Dane na urządzeniu</span>
  </div>
  <div class="card">
    <div class="eyebrow">TWÓJ DZIENNICZEK</div>
    <h2>Ważne informacje<br />w jednym miejscu.</h2>
    <div class="row"><span class="check">✓</span>Historia podań</div>
    <div class="row"><span class="check">✓</span>Potwierdzenie wymiany</div>
    <div class="line"></div>
    <div class="small">Dla pacjenta i opiekuna</div>
  </div>
</html>
